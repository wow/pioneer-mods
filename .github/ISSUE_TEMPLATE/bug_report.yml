name: Bug report
description: Something in the tooling behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach or paste vendor firmware files.** Identify firmware by model, version, and hash only.
        Security or device-safety problems → use private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Project version or commit
      placeholder: e.g. v0.1.0-alpha.1 or a1b2c3d
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and firmware version (if relevant)
      placeholder: e.g. XDJ-1000MK2, firmware 1.xx
  - type: input
    id: firmware-hash
    attributes:
      label: Input firmware SHA-256 (if relevant)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, options, and logs. Redact anything sensitive.
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have not attached or pasted any vendor firmware.
          required: true
