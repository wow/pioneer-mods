[workspace]
members = [
  "core/patch-cli",
  "core/patch-core",
  "core/patch-schema",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"
version = "0.1.0-alpha.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.190"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"

# The LZSS encoder/decoder dominate test time on 64 MiB inputs. Light optimisation keeps
# `cargo test` fast while debug assertions and overflow checks stay enabled.
[profile.dev.package.patch-core]
opt-level = 1
